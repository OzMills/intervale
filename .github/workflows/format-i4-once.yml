name: Format I4 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/content/fake/registry.ts src/sim/contracts.ts src/sim/fake/accrual.ts src/sim/fake/simulate.ts src/sim/fake/state.ts src/sim/index.ts src/sim/random/prng.ts src/sim/validate-result.ts tests/property/fake-segmentation.test.ts tests/unit/fake-simulation.test.ts tests/unit/prng.test.ts tests/unit/simulation-invariants.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/fake/registry.ts src/sim/contracts.ts src/sim/fake/accrual.ts src/sim/fake/simulate.ts src/sim/fake/state.ts src/sim/index.ts src/sim/random/prng.ts src/sim/validate-result.ts tests/property/fake-segmentation.test.ts tests/unit/fake-simulation.test.ts tests/unit/prng.test.ts tests/unit/simulation-invariants.test.ts
          git commit -m "Format I4 simulation files"
          git push
