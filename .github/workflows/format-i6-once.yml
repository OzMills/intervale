name: Format I6 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/app/App.tsx src/app/model.ts src/app/runtime.ts src/app/styles.css tests/e2e/bootstrap.spec.ts tests/unit/app-model.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/model.ts src/app/runtime.ts src/app/styles.css tests/e2e/bootstrap.spec.ts tests/unit/app-model.test.ts
          git commit -m "Format I6 UI files"
          git push
