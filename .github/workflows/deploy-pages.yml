name: Temporary GitHub Pages test deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: intervale-pages-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build GitHub Pages artifact
        env:
          INTERVALE_BASE_PATH: /intervale/
        run: |
          pnpm build
          cp dist/index.html dist/404.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const html = readFileSync('dist/index.html', 'utf8');
          const manifest = JSON.parse(readFileSync('dist/manifest.webmanifest', 'utf8'));

          if (!html.includes('/intervale/assets/')) {
            throw new Error('Pages build does not reference assets under /intervale/.');
          }
          if (manifest.start_url !== '/intervale/' || manifest.scope !== '/intervale/') {
            throw new Error('Pages manifest start_url/scope are incorrect.');
          }
          if (!manifest.icons.every((icon) => icon.src.startsWith('/intervale/'))) {
            throw new Error('Pages manifest icons are not scoped under /intervale/.');
          }
          NODE
          test -f dist/sw.js
      - name: Install Chromium for Pages smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Test Pages routing, lifecycle, and offline shell
        env:
          INTERVALE_BASE_PATH: /intervale/
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 > "$RUNNER_TEMP/intervale-pages-preview.log" 2>&1 &
          preview_pid=$!

          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/intervale/ > /dev/null; then
              pnpm exec playwright test tests/e2e/pages-subpath.spec.ts --project=chromium
              exit
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/intervale-pages-preview.log"
          exit 1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
