name: Format I1 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write src/application/save/export-save.ts src/application/save/import-save.ts src/persistence/initialize.ts src/persistence/records.ts src/persistence/schemas.ts tests/unit/persistence.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/save/export-save.ts src/application/save/import-save.ts src/persistence/initialize.ts src/persistence/records.ts src/persistence/schemas.ts tests/unit/persistence.test.ts
          git commit -m "Format I1 persistence files"
          git push
