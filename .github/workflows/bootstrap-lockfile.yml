name: Bootstrap lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "Update pnpm lockfile for persistence tests"
          git push
